apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: objects.demo.crossplane.io
  annotations:
    # After Provider is Healthy; Argo waits for XRD Established
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  scope: Namespaced
  group: demo.crossplane.io
  names:
    kind: Object
    plural: objects
  defaultCompositionRef:
    name: object-nginx
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                content:
                  description: >
                    HTML (or plain text) stored in ConfigMap data key "static"
                    and mounted into the nginx Deployment as the webpage.
                  type: string
              required:
                - content
            status:
              type: object
              properties:
                configMapName:
                  type: string
                deploymentName:
                  type: string

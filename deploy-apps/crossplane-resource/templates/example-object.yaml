{{- if .Values.example.enabled }}
apiVersion: demo.crossplane.io/v1alpha1
kind: Object
metadata:
  name: {{ .Values.example.name }}
  annotations:
    # Last: needs XRD CRD + Composition + ProviderConfig
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # Passed into ConfigMap data.static and shown by nginx
  content: |
{{ .Values.example.content | indent 4 }}
{{- end }}
